<style>
:root{
  --ink:#F7F9F1;--leaf:#8FE0A9;--leaf-deep:#4EA971;--blossom:#E9B45B;--bone:#F0F2EA;

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--txt-d);
  background:
    radial-gradient(900px 460px at 80% 12%,rgba(120,160,120,.2),transparent 62%),

.top{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(20px,4vw,44px)}

.lang{font-family:var(--mono);font-size:11.5px;color:var(--mut-d);border:1px solid rgba(28,43,32,.18);border-radius:999px;padding:6px 12px;letter-spacing:.22em;transition:.25s}

.main{flex:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:center;

.code{font-family:var(--serif);font-weight:900;font-size:clamp(130px,24vw,300px);line-height:1;

@supports not (-webkit-text-stroke:1px #000){.code{color:rgba(154,110,30,.12)}}

h1 em{font-style:normal;color:var(--leaf-deep)}
.sub{color:var(--mut-d);max-width:46ch;font-size:15px}
.sub .en{display:block;margin-top:6px;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;opacity:.8}
.ops{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 24px;font-size:14.5px;font-weight:700;letter-spacing:.04em;transition:transform .25s,box-shadow .25s,color .25s,border-color .25s}
.btn-solid{background:var(--leaf-deep);color:#fff}
.btn-solid:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(78,169,113,.5)}
.btn-ghost{border:1px solid rgba(28,43,32,.22);color:var(--txt-d)}
.btn-ghost:hover{border-color:var(--leaf-deep);color:var(--leaf-deep)}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--mut-d);margin-top:22px;letter-spacing:.06em}
.fig{position:relative;border:1px solid rgba(28,43,32,.14);border-radius:14px;aspect-ratio:4/3;overflow:hidden;
  background:linear-gradient(180deg,#FFFFFF,#F6F8F0)}
#twig{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;display:block}
.fig-cap{position:absolute;left:14px;bottom:11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mut-d);pointer-events:none}
.replant{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--leaf-deep);
  border:1px solid rgba(28,43,32,.18);border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.6);transition:.25s}
.replant:hover{background:var(--leaf-deep);color:#fff}
.links{border-top:1px solid rgba(28,43,32,.1);padding:18px clamp(20px,4vw,44px);display:flex;flex-wrap:wrap;gap:12px 26px;justify-content:space-between;
  font-size:12.5px;color:#63755F}
.links a{color:#57695D;border-bottom:1px dotted #9AA894;padding-bottom:2px;transition:.2s}
.links a:hover{color:var(--leaf-deep)}
@media(max-width:900px){

@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

<body>

<main class="main">

    <p class="sub">你要找的页面可能已被移动、删除，或者还在生长中。
      <span class="en">// This branch hasn't grown yet. The page may have been moved, removed, or is still growing.</span>

<script>
(function(){
'use strict';
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var fig=document.getElementById('fig'),cv=document.getElementById('twig');
var ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,t0=performance.now(),seed=(Math.random()*1e9)|0;
var BR=[86,110,90],TIP=[130,170,140],GOLD=[214,150,58];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mix(c1,c2,p){return 'rgb('+Math.round(c1[0]+(c2[0]-c1[0])*p)+','+Math.round(c1[1]+(c2[1]-c1[1])*p)+','+Math.round(c1[2]+(c2[2]-c1[2])*p)+')'}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=fig.clientWidth;H=fig.clientHeight;
  cv.width=Math.max(1,W*DPR);cv.height=Math.max(1,H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function build(){
  var rnd=mulberry(seed);
  var segs=[],buds=[],cum=0,maxD=6;
  function branch(x,y,a,len,w,d,s0){
    var x2=x+Math.sin(a)*len,y2=y-Math.cos(a)*len;
    segs.push({x:x,y:y,x2:x2,y2:y2,w:w,c:mix(BR,TIP,d/maxD),s:s0});
    cum+=len;
    if(len<8||d===maxD){
      if(rnd()<0.5)buds.push({x:x2,y:y2,r:rnd()*2.4+1.4,s:cum});
      return;
    }
    var n=rnd()<0.6?2:1;
    for(var i=0;i<n;i++){
      var sp=n===1?(rnd()-0.5)*0.8:((i/(n-1))-0.5)*1.5+(rnd()-0.5)*0.2;
      branch(x2,y2,a+sp,len*(0.62+rnd()*0.16),w*0.62,d+1,cum);
    }
  }
  branch(W*0.5,H*0.96,0,H*0.24,10,0,0);
  return {segs:segs,buds:buds,total:cum};
}
var geo=null;
function paint(now){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(78,169,113,.45)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(W*0.5,H*0.965,W*0.24,4,0,0,Math.PI*2);ctx.stroke();
  if(!geo)geo=build();
  var gp=REDUCED?1:Math.min(1,(now-t0)/2600);
  var grown=geo.total*(1-Math.pow(1-gp,3));
  ctx.lineCap='round';
  for(var i=0;i<geo.segs.length;i++){
    var s=geo.segs[i];
    if(s.s>=grown)continue;
    var dx=s.x2-s.x,dy=s.y2-s.y,len=Math.sqrt(dx*dx+dy*dy)||1;
    var k=Math.min(1,(grown-s.s)/len);
    ctx.strokeStyle=s.c;ctx.lineWidth=Math.max(.7,s.w);
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+dx*k,s.y+dy*k);ctx.stroke();
  }
  for(var b=0;b<geo.buds.length;b++){
    var u=geo.buds[b],ku=Math.max(0,Math.min(1,(grown-u.s)/40));
    if(ku<=0)continue;
    ctx.beginPath();
    ctx.fillStyle='rgba('+GOLD[0]+','+GOLD[1]+','+GOLD[2]+','+(0.85*ku).toFixed(3)+')';
    ctx.arc(u.x,u.y,u.r*ku,0,Math.PI*2);ctx.fill();
  }
}
function loop(now){paint(now);if(now-t0<2800)requestAnimationFrame(loop)}
function replant(){seed=(Math.random()*1e9)|0;geo=null;t0=performance.now();
  if(REDUCED){paint(performance.now())}else{requestAnimationFrame(loop)}}
window.addEventListener('resize',function(){resize();geo=null;paint(performance.now())});
document.getElementById('replant').addEventListener('click',replant);
cv.addEventListener('click',replant);
window.addEventListener('keydown',function(e){
  if((e.key==='r'||e.key==='R')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))replant();
});
resize();
if(REDUCED)paint(performance.now());else requestAnimationFrame(loop);
})();
</script>
