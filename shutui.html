<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>安装树推</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      width: min(420px, 100%);
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #111;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 24px; color: #6e6e73; line-height: 1.6; }
    .button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      background: #007aff;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: #8e8e93;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">树</div>
    <h1>安装「树推」</h1>
    <p>点击下面的按钮安装描述文件，安装完成后「树推」会出现在 iPhone 主屏幕。</p>
    <a class="button" href="./树推.mobileconfig">安装树推</a>
    <div class="hint">
      请使用 iPhone Safari 打开此页面。<br>
      安装后前往「设置」完成描述文件安装。
    </div>
  </main>
</body>
</html>
