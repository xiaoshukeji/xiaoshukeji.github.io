<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<title>安装「树推」</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
main{max-width:430px;margin:0 auto;min-height:100vh;padding:56px 22px 36px;text-align:center}
.icon{width:88px;height:88px;margin:0 auto 20px;border-radius:20px;background:#111;color:#fff;display:grid;place-items:center;font-size:42px;font-weight:700;box-shadow:0 8px 24px #0002}
h1{font-size:30px;margin:0 0 10px}
p{color:#666;line-height:1.6;margin:8px 0}
.button{display:block;margin:28px 0 20px;padding:15px 20px;border-radius:14px;background:#007aff;color:#fff;text-decoration:none;font-size:18px;font-weight:600}
.card{text-align:left;background:#fff;border-radius:16px;padding:18px;margin-top:18px}
.card b{display:block;margin-bottom:8px}
.small{font-size:14px;color:#777}
</style>
</head>
<body>
<main>
  <img class="icon" src="./icon.png" alt="树推" width="88" height="88">
  <h1>安装「树推」</h1>
  <p>把「树推」网页添加到 iPhone 主屏幕。</p>
  <a class="button" href="./树推.mobileconfig">安装描述文件</a>
  <div class="card">
    <b>安装步骤</b>
    <p>1. 请使用 iPhone 的 Safari 打开本页面。</p>
    <p>2. 点击上面的“安装描述文件”。</p>
    <p>3. 如果提示已下载，请打开“设置”，进入“已下载描述文件”。</p>
    <p>4. 点击“安装”，按提示完成即可。</p>
  </div>
  <p class="small">iPhone 需要能访问 192.168.31.16；「树推」网页地址为 http://192.168.31.16:4173</p>
</main>
</body>
</html>
